<header class="hdr">
  <a class="hdr__brand" routerLink="/">
    <soc-logo variant="mark" [markSize]="30" />
    <span class="hdr__brand-text">
      <span class="hdr__brand-name">Pak Suzuki</span>
      <span class="hdr__brand-sub">Security Operations Center</span>
    </span>
  </a>

  <nav class="hdr__nav" aria-label="Primary">
    @for (item of nav; track item.path) {
      @if (item.enabled) {
        <a
          class="hdr__link"
          [routerLink]="item.path"
          routerLinkActive="hdr__link--active"
          [routerLinkActiveOptions]="{ exact: true }"
        >{{ item.label }}</a>
      } @else {
        <span class="hdr__link hdr__link--disabled" title="Coming soon">{{ item.label }}</span>
      }
    }
  </nav>

  <div class="hdr__right">
    <span class="hdr__clock" title="Coordinated Universal Time">{{ clock() }} UTC</span>
    <button class="hdr__icon-btn" type="button" aria-label="Notifications">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
        <path d="M13.7 21a2 2 0 0 1-3.4 0" />
      </svg>
      <span class="hdr__ping" aria-hidden="true"></span>
    </button>
    <div class="hdr__avatar" title="SOC Analyst">SA</div>
  </div>
</header>
